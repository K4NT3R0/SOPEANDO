name: Compilar Android
on:
  workflow_dispatch:
    inputs:
      anuncios_reales:
        description: "Anuncios reales (activar solo para la versión de producción)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar web
        run: |
          mkdir -p www
          cp index.html www/
          if [ "${{ inputs.anuncios_reales }}" = "true" ]; then sed -i 's/test:true,/test:false,/' www/index.html; fi
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Clave de firma
        id: ks
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "sign=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -keystore release.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Sopeando, C=ES"
            git config user.name github-actions
            git config user.email actions@github.com
            git add release.keystore
            git commit -m "Clave de subida"
            git push
          fi
          echo "sign=1" >> "$GITHUB_OUTPUT"
      - name: Ajustes de Android
        run: python3 patch_android.py
        env:
          SIGN: ${{ steps.ks.outputs.sign }}
          RUN_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android
      - name: APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: AAB firmado para Google Play
        if: steps.ks.outputs.sign == '1'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sopeando
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
